<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تجربة المشغّل المحمي</title>
<style>
:root{--bg:#eef1f5;--fg:#14202e;--card:#fff;--line:#d5dce6;--accent:#1d5fd1;--muted:#5b6b7e;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#0f151d;--fg:#e8edf4;--card:#18212c;--line:#2b3746;--accent:#6aa3ff;--muted:#93a3b8}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Segoe UI",Tahoma,Arial,sans-serif;padding:16px;min-height:100vh}
main{max-width:860px;margin:0 auto}
h1{font-size:1.2rem;margin:8px 0 14px}
.player{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.stage{position:relative;aspect-ratio:16/9;background:#000}
.stage #yt,.stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.shield{position:absolute;inset:0;z-index:2;cursor:pointer;background:transparent}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 12px;direction:ltr}
.bar button,.bar select{font:inherit;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer}
.bar button:focus-visible,.bar select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#seek{flex:1 1 100%;order:-1;accent-color:var(--accent)}
#vol{width:90px;accent-color:var(--accent)}
.time{color:var(--muted);font-variant-numeric:tabular-nums;font-size:.9rem;margin-inline-end:auto}
.note{color:var(--muted);font-size:.9rem;margin-top:12px;line-height:1.7}
.player:fullscreen{border-radius:0}
.player:fullscreen .stage{flex:1;aspect-ratio:auto}
</style>
</head>
<body>
<main>
<h1>تجربة المشغّل المحمي</h1>
<div class="player" id="player">
  <div class="stage" id="stage">
    <div id="yt"></div>
    <div class="shield" id="shield" title="تشغيل / إيقاف"></div>
  </div>
  <div class="bar">
    <input type="range" id="seek" min="0" max="1000" value="0" aria-label="التقدّم">
    <button id="play" type="button">▶ تشغيل</button>
    <button id="mute" type="button">🔊</button>
    <input type="range" id="vol" min="0" max="100" value="100" aria-label="الصوت">
    <select id="speed" aria-label="السرعة">
      <option value="0.5">0.5x</option><option value="0.75">0.75x</option>
      <option value="1" selected>1x</option><option value="1.25">1.25x</option>
      <option value="1.5">1.5x</option><option value="2">2x</option>
    </select>
    <button id="full" type="button">⛶</button>
    <span class="time" id="time">0:00 / 0:00</span>
  </div>
</div>
<p class="note">الطبقة الشفافة فوق الفيديو بتمنع الضغط على لوجو يوتيوب والعنوان وكليك يمين، والتحكم كله من الأزرار دي. ملحوظة: رابط الفيديو يفضل ظاهر لمن يفتح أدوات المطوّر.</p>
</main>
<script>
var VIDEO_ID = "A7dVNM7Dn6w";
var player, timer, ready = false;
var $ = function(id){ return document.getElementById(id); };
function fmt(s){ s = Math.floor(s||0); var m = Math.floor(s/60), r = s%60; return m + ":" + (r<10?"0":"") + r; }

function onYouTubeIframeAPIReady(){
  player = new YT.Player("yt", {
    host: "https://www.youtube-nocookie.com",
    videoId: VIDEO_ID,
    playerVars: { controls:0, disablekb:1, modestbranding:1, rel:0, iv_load_policy:3, playsinline:1, fs:0, cc_load_policy:0 },
    events: { onReady: onReady, onStateChange: onState }
  });
}
function onReady(){ ready = true; tick(); }
function onState(e){
  var playing = e.data === YT.PlayerState.PLAYING;
  $("play").textContent = playing ? "⏸ إيقاف" : "▶ تشغيل";
  clearInterval(timer);
  if (playing) timer = setInterval(tick, 250);
  tick();
}
function tick(){
  if (!ready) return;
  var d = player.getDuration() || 0, c = player.getCurrentTime() || 0;
  if (d) $("seek").value = Math.round(c/d*1000);
  $("time").textContent = fmt(c) + " / " + fmt(d);
}
function toggle(){
  if (!ready) return;
  player.getPlayerState() === YT.PlayerState.PLAYING ? player.pauseVideo() : player.playVideo();
}
$("play").onclick = toggle;
$("shield").onclick = toggle;
$("seek").oninput = function(){
  if (!ready) return;
  player.seekTo(this.value/1000 * player.getDuration(), true);
};
$("vol").oninput = function(){ if (ready){ player.setVolume(+this.value); player.unMute(); $("mute").textContent = this.value == 0 ? "🔇" : "🔊"; } };
$("mute").onclick = function(){
  if (!ready) return;
  if (player.isMuted()){ player.unMute(); this.textContent = "🔊"; }
  else { player.mute(); this.textContent = "🔇"; }
};
$("speed").onchange = function(){ if (ready) player.setPlaybackRate(+this.value); };
$("full").onclick = function(){
  var el = $("player");
  if (document.fullscreenElement) document.exitFullscreen();
  else if (el.requestFullscreen) el.requestFullscreen();
  else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
};
$("stage").addEventListener("contextmenu", function(e){ e.preventDefault(); });
document.addEventListener("keydown", function(e){
  if (e.code === "Space" && e.target.tagName !== "BUTTON" && e.target.tagName !== "SELECT"){ e.preventDefault(); toggle(); }
});

var s = document.createElement("script");
s.src = "https://www.youtube.com/iframe_api";
document.head.appendChild(s);
</script>
</body>
</html>
